# Identità e misure del canale: tutto ciò che è "brand" sta qui, non nel codice.
# Per un override locale non versionato crea config.local.toml con le stesse sezioni (merge per chiave).

[canale]
nome = ""                 # vuoto = nessun piede a schermo
handle = ""               # es. "@mio_handle"

[presentatore]
nome = "Presentatore"     # usato nel gobbo e nei report
avatar = "assets/presentatore/avatar.png"   # segnaposto per l'anteprima senza clip (uv run reel setup lo genera)

[video]
larghezza = 1080
altezza = 1920
fps = 30

[palette]                 # tema scuro pieno, niente gradienti
sfondo = "#111318"
testo = "#F2F2F5"
attenuato = "#9A9DAB"
accento = "#FFC24B"       # una sola parola evidenziata per scena
secondario = "#7AA2FF"
terziario = "#5BD6A3"

[font]
famiglia = "Inter Variable"
mono = "JetBrains Mono"
file = ["assets/fonts/InterVariable.ttf", "assets/fonts/InterVariable-Italic.ttf",
        "assets/fonts/JetBrainsMono-Variable.ttf", "assets/fonts/JetBrainsMono-Italic-Variable.ttf"]

[safe_area]               # px coperti dall'interfaccia di Instagram nei Reel
alto = 220
destra = 120
basso = 340
sinistra = 60

[riquadro]                # riquadro del presentatore
forma = "cerchio"         # cerchio | arrotondato
dimensione_px = 360
raggio_px = 48            # solo arrotondato
posizione = "alto-destra"    # basso-destra | basso-sinistra | alto-destra | alto-sinistra
                             # dal 2026-09-20 sta in alto: la fascia delle caption occupa il fondo
margine_px = 24

[caption]                 # sottotitoli sincronizzati con la voce, bruciati nel montaggio dopo la registrazione
                          # (tools/reel/caption.py). L'animazione non può disegnare qui dentro.
posizione = "basso"       # basso | alto (deroga per scena con `CAPTION: alto`)
altezza_px = 200          # fascia riservata: 2 righe + interlinea + margine interno
margine_px = 24           # aria fra la fascia e l'area del contenuto
righe_max = 2
caratteri_riga_max = 42   # a capo misurato con Pillow; oltre, il blocco si spezza
parole_blocco = 7         # parole per blocco (6-8: un respiro di lettura)
durata_min_s = 0.7        # sotto questa, il blocco si fonde con il vicino
corpo_px = 56
piastra_opacita = 0.75    # piastra piena dietro il testo: serve sulle scene a filmato
raggio_px = 16

[schermo]                 # cornice del b-roll / screen recording (px, dentro la safe area)
x = 60
y = 604               # sotto il riquadro in alto a destra
larghezza = 900
altezza = 752         # fino al bordo della fascia delle caption
raggio_px = 36

[voce_sintetica]          # solo per l'anteprima senza clip
comando = "say"
voce = "Alice"
parole_al_secondo = 2.8   # stima usata anche da `reel valida`
velocita_wpm = 170        # passata a `say -r`
pausa_frasi_s = 0.3       # silenzio tra le frasi: una frase alla volta, così gli inizi sono esatti

[transizioni]
tipo = "dissolvenza"      # taglio | dissolvenza
durata_s = 0.25
immagini = ["zoomin", "circleopen", "smoothleft", "radial"]  # fra le immagini Meshy di una scena (xfade), in giro
immagini_s = 0.45         # più lunga della dissolvenza: il passaggio si deve vedere (2026-09-23)
filmato = "taglio"        # taglio | dissolvenza: le giunzioni che toccano una scena a filmato ([broll], hook a filmato)
raccordo_riquadro_s = 0.5 # il volto a tutta tela che si rimpicciolisce fino al cerchio del riquadro della scena dopo
                          # (e il contrario prima della chiusura): sta dentro la scena a volto pieno, e quella
                          # giunzione resta sempre un taglio. 0 = stacco secco come prima

[registrazione]           # `uv run reel registra`: presa unica sull'anteprima --prova (i default sono in tools/reel/registra.py)
video = 0                 # fotocamera avfoundation: indice o parte del nome (`uv run reel registra --dispositivi`)
# audio = "MacBook"       # microfono PortAudio (indice o parte del nome); assente = il microfono predefinito di sistema
risoluzione = "1080x1920" # verticale nativa (la fotocamera la offre, 2026-09-21): apertura e chiusura a volto pieno
                          # usano il fotogramma intero senza ingrandire; le altre scene ne ritagliano il quadrato
                          # dell'inquadratura, che finisce nel riquadro da 360 px (mai sotto 360 px)
fps = 30
preroll_s = 2.0           # il reel parte questi secondi prima della scena scelta
conto_alla_rovescia_s = 3
latenza_s = 0.10          # ritardo fra la fotocamera e il fotogramma letto; se la voce risulta spostata di una costante, ritoccalo e rifai --spezza
codec = "h264_videotoolbox"
bitrate = "8M"

[percorsi]                # dal 2026-09-23: nel progetto solo il riepilogo di ogni reel (contenuti/render/<slug>/)
lavoro = "~/Library/Caches/reel-anim"   # il transitorio (Manim, scene montate, voce di prova, strisce): `reel pulisci`
cache_broll = "~/Library/Application Support/reel-anim/cache-broll"   # filmati scaricati e immagini Meshy (pagate)

[stile]                   # corpus di reel altrui trascritti (reelkit): docs/stile-parlato.md ne distilla le regole
corpus = "~/Projects/reelkit/export.md"   # override in config.local.toml; "" = nessun corpus
guida = "docs/stile-parlato.md"           # relativo alla radice del repo
pattern = "~/Projects/reelkit/pattern.md" # pattern narrativi (./reelkit pattern): ideatore e sceneggiatore lo leggono così com'è
indice = "~/Projects/reelkit/indice.json"         # l'indice di reelkit: account, lingua e durata di ogni reel trascritto
trascrizioni = "~/Projects/reelkit/trascrizioni"  # il parlato vero, un file per reel: lo sceneggiatore ne legge alcune
                                                  # intere prima di scrivere la VOCE (`uv run reel stile --trascrizioni`)

[uscite]                  # `uv run reel uscite` (tappa T0b): le uscite vere dei testi attribuiti a un modello
anonimizza = []           # coppie ["vero", "finto"] oltre a nome ed email di git (dominio, città…): i dati veri stanno in config.local.toml

[copione]                 # `uv run reel copione <idea>`: il parlato da un modello esterno, prima della sceneggiatura
modelli = ["gpt-5.4", "deepseek-v4-pro", "gemini-3.1-pro", "claude"]  # catena di riserva: si scende solo se fallisce
                          # (ordine dalla prova alla cieca del 2026-09-23); "claude" = `claude -p`, niente punti Poe
claude_modello = "opus"
parole = 235              # in tutto (≈ 85 s a 2,8 parole/s); oltre il 10 % in più il modello riceve una correzione
trascrizioni = 6          # reel di reelkit nel prompt, per l'orecchio
token_uscita = 6000       # per stimare il costo massimo di una chiamata (Poe lo riserva prima di rispondere)
punti_minimi = 1500       # sotto questo saldo i modelli Poe si saltano
