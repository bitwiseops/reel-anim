[project]
name = "reel-broll"
version = "0.1.0"
description = "Sceglie e prepara il materiale esterno dei reel: piano visivo, ricerca, provini, resa a tutto schermo"
requires-python = ">=3.12"
dependencies = [
    "reel-anim",
    "requests>=2.32",
]

[project.scripts]
broll = "broll.__main__:main"

# Le dipendenze pesanti (torch, open-clip-torch, faster-whisper) arrivano con la M7, in un
# [dependency-groups] ml qui dentro: il lock e il venv della radice non le vedono mai.
[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
reel-anim = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["broll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: test lenti con ffmpeg"]
